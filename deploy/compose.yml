name: cloudcli

services:
  app:
    image: ${CLOUDCLI_IMAGE:?CLOUDCLI_IMAGE must be set in /opt/cloudcli/.env}
    container_name: cloudcli
    restart: unless-stopped
    env_file:
      - .env
    # Never 0.0.0.0: the bind address is either the host's tailnet IP — reachable
    # only by tailnet members, over WireGuard-encrypted transport — or loopback
    # when the host has no tailnet. Either way the app stays off the public
    # internet even if the firewall is flushed. Resolved by deploy.sh.
    ports:
      - "${CLOUDCLI_BIND_ADDR:-127.0.0.1}:${CLOUDCLI_HOST_PORT:-3001}:3001"
    volumes:
      # Carries auth.db, Claude Code sessions, git and SSH config — everything
      # that must survive an image rollout.
      - home:/home/node
      - workspace:/workspace
    # node-pty children need time to exit before the runtime kills them.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  home:
  workspace:
